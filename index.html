<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />

        <!--
      Fallback statico. Gli scraper social (WhatsApp, Facebook, LinkedIn) non
      eseguono JavaScript e quindi non vedono i tag iniettati da react-helmet-async:
      leggono solo questo HTML. I tag qui sotto valgono per tutte le rotte;
      Google, che esegue JS, usa invece quelli per-pagina di src/components/SEO.jsx.
    -->
        <title>MBM Meccanica | Lavorazioni CNC</title>
        <meta
            name="description"
            content="Officina metalmeccanica tra Vignola e Castelvetro di Modena: fresatura e tornitura CNC di precisione per automotive, packaging e meccanica industriale. Conto terzi."
        />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MBM Meccanica" />
        <meta property="og:locale" content="it_IT" />
        <meta property="og:title" content="MBM Meccanica | Lavorazioni CNC" />
        <meta
            property="og:description"
            content="Officina metalmeccanica tra Vignola e Castelvetro di Modena: fresatura e tornitura CNC di precisione per automotive, packaging e meccanica industriale. Conto terzi."
        />
        <meta property="og:url" content="https://www.mbmmeccanica.com/" />
        <meta property="og:image" content="https://www.mbmmeccanica.com/og-image.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="MBM Meccanica - lavorazioni CNC di precisione, flangia in alluminio lavorata a Castelvetro di Modena"
        />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="MBM Meccanica | Lavorazioni CNC" />
        <meta
            name="twitter:description"
            content="Officina metalmeccanica tra Vignola e Castelvetro di Modena: fresatura e tornitura CNC di precisione per automotive, packaging e meccanica industriale. Conto terzi."
        />
        <meta name="twitter:image" content="https://www.mbmmeccanica.com/og-image.jpg" />

        <!--
      Il poster della hero è la prima cosa grande che si vede: lo scarichiamo
      subito, in parallelo al bundle JS, invece di aspettare che React lo monti.
      L'HTML è lo stesso per tutte le rotte, quindi si sceglie qui in base al
      percorso (e al breakpoint md per la variante mobile della home).
      Gli URL devono coincidere con i poster usati in Home.jsx e Azienda.jsx.
    -->
        <script>
            (function () {
                var path = location.pathname.replace(/\/+$/, '') || '/';
                var mobile = window.matchMedia('(max-width: 767px)').matches;
                var posters = {
                    '/': mobile ? '/video/hero-mobile-poster.webp' : '/video/hero-poster.webp',
                    '/azienda': '/video/hero-azienda-poster.webp',
                };
                var href = posters[path];
                if (!href) return;
                var link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = href;
                link.fetchPriority = 'high';
                document.head.appendChild(link);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
